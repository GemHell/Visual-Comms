<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="style.css">
	
</head>
<body>

<!-- Image Map Generated by http://www.image-map.net/ -->
<img id="image-map-img" src="https://www.hollywoodreporter.com/wp-content/uploads/2026/04/7bob-insider-TCM-Main-w-SPLASH-2026.jpg?w=2000&amp;h=1126&amp;crop=1" usemap="#image-map">

<map name="image-map">
    <area target="_parent" alt="syllabus" title="syllabus" href="https://docs.google.com/document/d/1FmMOD6Z1wcmvo2B4KCb38ZUxevMwpqmT/edit" coords="966,465,708,164" shape="rect">
    <area target="_top" alt="html target attribute" title="html target attribute" href="https://www.w3schools.com/tags/att_a_target.asp" coords="1215,497,1209,638,1315,780,1413,776,1504,677,1540,525,1483,399,1342,341,1262,391" shape="poly">
</map>
<a href="https://www.google.com" target="_blank">google</a>

<script>
	// Create SVG overlay for area outlines
	const img = document.getElementById('image-map-img');
	const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
	svg.style.position = 'absolute';
	svg.style.cursor = 'pointer';
	svg.style.pointerEvents = 'none';
	svg.setAttribute('width', img.width);
	svg.setAttribute('height', img.height);
	svg.style.top = img.offsetTop + 'px';
	svg.style.left = img.offsetLeft + 'px';
	
	img.parentNode.insertBefore(svg, img.nextSibling);

	document.querySelectorAll('area').forEach(area => {
		const coords = area.coords.split(',').map(Number);
		const shape = area.shape;
		let element;

		if (shape === 'rect') {
			element = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
			element.setAttribute('x', Math.min(coords[0], coords[2]));
			element.setAttribute('y', Math.min(coords[1], coords[3]));
			element.setAttribute('width', Math.abs(coords[2] - coords[0]));
			element.setAttribute('height', Math.abs(coords[3] - coords[1]));
		} else if (shape === 'poly') {
			element = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
			let points = '';
			for (let i = 0; i < coords.length; i += 2) {
				points += coords[i] + ',' + coords[i + 1] + ' ';
			}
			element.setAttribute('points', points);
		}

		element.style.fill = 'none';
		element.style.stroke = 'red';
		element.style.strokeWidth = '2';
		element.style.display = 'none';
		svg.appendChild(element);

		area.addEventListener('mouseenter', function() {
			element.style.display = 'block';
		});
		area.addEventListener('mouseleave', function() {
			element.style.display = 'none';
		});
	});
</script>

</body>
</html>
